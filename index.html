
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>TCL Tebus Murah Harga Spesial</title>

  <link
    rel="icon"
    href="https://aws-obg-image-lb-2.tcl.com/content/dam/brandsite/it-resources/common/navigation/tcl-logo.svg"
    type="image/svg+xml"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: sans-serif;
    }

    .iframe-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;  /* Fallback browser lama */
      height: 100dvh; /* Dynamic viewport untuk mobile */
      overflow: hidden;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      border: none;
    }

    .loader {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.2rem;
      color: #666;
      z-index: 10;
    }
  </style>
</head>

<body>
  <div class="iframe-container">

    <div class="loader" id="loader">
      Loading app...
    </div>

    <iframe
      src="https://script.google.com/a/macros/tclindonesia.com/s/AKfycbz0bu0Dbt5CsDwgQFeKtEUk8DFI2qpdUcIh7zsJRfikAllQG_aJGU7VsuI8-bJCIP2l8g/exec"
      title="TCL Tebus Murah Harga Spesial"
      onload="document.getElementById('loader').style.display='none';"
      allowfullscreen>
    </iframe>

  </div>
</body>
</html>
